name: Recommendation performance and GO search
on:
  push:
    branches: ['refactor/performance-go-search-20261026']
  pull_request:
    paths: ['pvpoke_app_selection.py', 'pvpoke_candidate_comparison.py', 'pvpoke_go_search.py', 'pvpoke_app_ui.py', 'pvpoke_score_search.py', 'tests/**', '.github/workflows/performance-search.yml']
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: for file in tests/test_app_*.js; do node "$file"; done
