name: Recommendation performance and GO search
on:
  push:
    branches: ['refactor/performance-go-search-20261026']
  pull_request:
    paths: ['pvpoke_app_selection.py', 'pvpoke_candidate_comparison.py', 'pvpoke_go_search.py', 'pvpoke_app_ui.py', 'pvpoke_score_search.py', 'tests/**', '.github/workflows/performance-search.yml']
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: for file in tests/test_app_*.js; do node "$file"; done
