name: Security and regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked runtime and audit dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --disable-pip --no-deps
      - name: Secret scan of reachable Git history
        run: |
          curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts='--all'
      - name: Python and JavaScript regression tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test*.py'
          for test in tests/test*.js tests/test*.cjs; do node "$test"; done
          for source in *.js; do node --check "$source"; done
          sh -n start.sh
      - name: Build production image and verify proxy configuration
        run: |
          docker build -t pokemoniv-security-ci .
          docker run --rm --user 10001:10001 --entrypoint sh -e PORT=8787 pokemoniv-security-ci -c 'python /app/pvpoke_proxy_config.py && mkdir -p /tmp/pokemoniv-nginx/body /tmp/pokemoniv-nginx/proxy /tmp/pokemoniv-nginx/fastcgi /tmp/pokemoniv-nginx/uwsgi /tmp/pokemoniv-nginx/scgi && nginx -t -e stderr -c /tmp/pokemoniv-nginx.conf'
          docker run --rm --user 10001:10001 -v "$PWD/tests:/tests:ro" --entrypoint python pokemoniv-security-ci -m unittest discover -s /tests -p test_proxy_gateway.py -v
          docker run --rm -v "$PWD:/work" -w /work --entrypoint python pokemoniv-security-ci -m unittest discover -s tests -p 'test*.py'
          docker run --rm --entrypoint python pokemoniv-security-ci -m pip inspect > python-packages.json
          docker run --rm --entrypoint dpkg-query pokemoniv-security-ci -W > os-packages.txt
      - name: Stage 7 isolated non-root container and loopback security probe
        run: |
          set -eu
          name=pokemoniv-stage7-ci
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          # No published ports or external connectivity; no real keys/data.
          docker run -d --name "$name" --network none --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 768m --memory-swap 768m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /data:rw,nosuid,nodev,size=48m,uid=10001,gid=10001,mode=0700 \
            --mount type=bind,src="$PWD/tests",dst=/tests,readonly \
            -e PVP_API_KEY=stage7-synthetic-only-000000000000000000000000 \
            -e PVP_ARCHIVE_DIR=/data \
            -e PVP_MCP_URL=https://stage7.invalid/mcp \
            -e PVP_BATTLE_API_ENABLED=1 \
            -e PVP_MISSING_ANALYSIS_ENABLED=1 \
            -e PVP_SANDBOX_ENABLED=1 \
            -e PVP_OBSERVED_SEARCH_ENABLED=0 \
            --entrypoint /app/start.sh pokemoniv-security-ci
          ready=0
          for attempt in $(seq 1 50); do
            if docker exec "$name" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=1)" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
              echo 'Isolated container exited before health'
              docker logs --tail 30 "$name"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec "$name" python /tests/stage7_container_smoke.py
          docker stats --no-stream --format 'CPU {{.CPUPerc}} MEM {{.MemUsage}} PIDS {{.PIDs}}' "$name"
      - name: Real ENOSPC and ownership rollback in disposable 2 MiB tmpfs
        run: |
          docker run --rm --user 10001:10001 \
            --tmpfs /tmp/pvp-enospc:rw,size=2m,mode=1777 \
            -e PYTHONPATH=/app -e PVP_REAL_ENOSPC_ROOT=/tmp/pvp-enospc \
            -v "$PWD/tests:/tests:ro" --entrypoint python pokemoniv-security-ci \
            -m unittest discover -s /tests -p test_real_enospc.py -v
      - name: Mobile browser initialization under CSP
        run: |
          docker build --target browser-check -t pokemoniv-browser-ci .
          npm install --no-save --no-package-lock playwright@1.57.0
          docker run --rm -v "$PWD:/work" -w /work -e STRATEGY_CHROMIUM_PATH=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/security_browser.cjs
          docker run --rm -v "$PWD:/work" -w /work -e CHROME_BIN=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/browser_meta_editor_smoke.cjs
          docker run --rm -v "$PWD:/work" -w /work -e CHROME_BIN=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/browser_missing_analysis.cjs
          docker run --rm -v "$PWD:/work" -w /work -e CHROME_BIN=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/browser_sandbox.cjs
      - name: Audit operating-system and application packages and create SBOM
        run: |
          curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          echo 'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  /tmp/trivy.tar.gz' | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy image --timeout 10m --scanners vuln --format json --output image-vulnerabilities.json pokemoniv-security-ci
          /tmp/trivy image --timeout 10m --format cyclonedx --output image-sbom.cdx.json pokemoniv-security-ci
          python tools/check_image_vulnerabilities.py image-vulnerabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-package-inventory
          path: |
            python-packages.json
            os-packages.txt
            image-vulnerabilities.json
            image-sbom.cdx.json
            meta-editor-qa
          retention-days: 14
