name: Security and regression
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Determine whether full container and browser gates are required
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'true' || 'false' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: >-
          python -B tools/ci_security_plan.py plan
          --event-name "$EVENT_NAME"
          --event-action "$EVENT_ACTION"
          --is-draft "$IS_DRAFT"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --before-sha "$BEFORE_SHA"
          --after-sha "$AFTER_SHA"

  regression-tests:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked runtime and audit dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --disable-pip --no-deps
      - name: Secret scan of reachable Git history
        run: |
          curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts='--all'
      - name: Python and JavaScript regression tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test*.py'
          # Fast mandatory smoke: the full unit suite also covers synthetic
          # RL contracts. Experimental comparisons are on-demand below.
          PYTHONPATH=.:tests python tools/run_rl_mc.py --train 4 --evaluate 2 --seed 12
          for test in tests/test*.js tests/test*.cjs; do node "$test"; done
          for source in *.js; do node --check "$source"; done
          sh -n start.sh
      - name: Optional synthetic RL research and performance experiments
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Exploratory only; never interpret these as competitive win rates.
          PYTHONPATH=.:tests python tools/benchmark_rl_step.py --episodes 2 --windows 4
          PYTHONPATH=.:tests python tools/evaluate_rl_mc.py --train 8 --evaluate 6 --seed 12
          PYTHONPATH=.:tests python tools/evaluate_rl_mc.py --policy v2 --train 8 --evaluate 6 --seed 12
          PYTHONPATH=.:tests python tools/evaluate_rl_fixed_selection.py --policy v2 --train 12 --evaluate 6 --seed 12
          PYTHONPATH=.:tests python tools/diagnose_rl_fixture.py --evaluate 6 --seed 12
          PYTHONPATH=.:tests python tools/evaluate_rl_fresh_holdout.py --policy v2 --train 12 --evaluate 6 --seed 12 --guarded-ablation

  container-and-audit:
    needs: plan
    if: needs.plan.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          tags: pokemoniv-security-ci
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      - name: Verify proxy configuration and container runtime inventory
        run: |
          docker run --rm --user 10001:10001 --entrypoint sh -e PORT=8787 pokemoniv-security-ci -c 'python /app/pvpoke_proxy_config.py && mkdir -p /tmp/pokemoniv-nginx/body /tmp/pokemoniv-nginx/proxy /tmp/pokemoniv-nginx/fastcgi /tmp/pokemoniv-nginx/uwsgi /tmp/pokemoniv-nginx/scgi && nginx -t -e stderr -c /tmp/pokemoniv-nginx.conf'
          docker run --rm --user 10001:10001 -v "$PWD/tests:/tests:ro" --entrypoint python pokemoniv-security-ci -m unittest discover -s /tests -p test_proxy_gateway.py -v
          docker run --rm --entrypoint python pokemoniv-security-ci -m pip inspect > python-packages.json
          docker run --rm --entrypoint dpkg-query pokemoniv-security-ci -W > os-packages.txt
      - name: Stage 7 isolated non-root container and loopback security probe
        run: |
          set -eu
          name=pokemoniv-stage7-ci
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          # No published ports or external connectivity; no real keys/data.
          docker run -d --name "$name" --network none --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 768m --memory-swap 768m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /data:rw,nosuid,nodev,size=48m,uid=10001,gid=10001,mode=0700 \
            --mount type=bind,src="$PWD/tests",dst=/tests,readonly \
            -e PVP_API_KEY=stage7-synthetic-only-000000000000000000000000 \
            -e PVP_ARCHIVE_DIR=/data \
            -e PVP_MCP_URL=https://stage7.invalid/mcp \
            -e PVP_BATTLE_API_ENABLED=1 \
            -e PVP_MISSING_ANALYSIS_ENABLED=1 \
            -e PVP_SANDBOX_ENABLED=1 \
            -e PVP_OBSERVED_SEARCH_ENABLED=0 \
            --entrypoint /app/start.sh pokemoniv-security-ci
          ready=0
          for attempt in $(seq 1 50); do
            if docker exec "$name" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=1)" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
              echo 'Isolated container exited before health'
              docker logs --tail 30 "$name"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec "$name" python /tests/stage7_container_smoke.py
          docker stats --no-stream --format 'CPU {{.CPUPerc}} MEM {{.MemUsage}} PIDS {{.PIDs}}' "$name"
      - name: Real ENOSPC and ownership rollback in disposable 2 MiB tmpfs
        run: |
          docker run --rm --user 10001:10001 \
            --tmpfs /tmp/pvp-enospc:rw,size=2m,mode=1777 \
            -e PYTHONPATH=/app -e PVP_REAL_ENOSPC_ROOT=/tmp/pvp-enospc \
            -v "$PWD/tests:/tests:ro" --entrypoint python pokemoniv-security-ci \
            -m unittest discover -s /tests -p test_real_enospc.py -v
      - name: Audit operating-system and application packages and create SBOM
        run: |
          curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          echo 'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  /tmp/trivy.tar.gz' | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy image --timeout 10m --scanners vuln --format json --output image-vulnerabilities.json pokemoniv-security-ci
          /tmp/trivy image --timeout 10m --format cyclonedx --output image-sbom.cdx.json pokemoniv-security-ci
          python tools/check_image_vulnerabilities.py image-vulnerabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-package-inventory
          path: |
            python-packages.json
            os-packages.txt
            image-vulnerabilities.json
            image-sbom.cdx.json
          retention-days: 14

  browser-csp:
    needs: plan
    if: needs.plan.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build browser-check image with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: browser-check
          load: true
          tags: pokemoniv-browser-ci
          cache-from: |
            type=gha,scope=browser-check
            type=gha,scope=production
          cache-to: type=gha,mode=max,scope=browser-check
      - name: Cache Playwright package
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: playwright-${{ runner.os }}-1.57.0
      - name: Install Playwright when cache missed
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npm install --no-save --no-package-lock playwright@1.57.0
      - name: Mobile browser initialization under CSP
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e STRATEGY_CHROMIUM_PATH=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/security_browser.cjs
          docker run --rm -v "$PWD:/work" -w /work -e CHROME_BIN=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/browser_meta_editor_smoke.cjs
          docker run --rm -v "$PWD:/work" -w /work -e CHROME_BIN=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/browser_missing_analysis.cjs
          docker run --rm -v "$PWD:/work" -w /work -e CHROME_BIN=/usr/bin/chromium --entrypoint node pokemoniv-browser-ci tests/browser_sandbox.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-meta-editor-qa
          path: meta-editor-qa
          if-no-files-found: ignore
          retention-days: 14

  security-regression:
    needs: [plan, regression-tests, container-and-audit, browser-csp]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify all required security and regression gates
        env:
          RUN_HEAVY: ${{ needs.plan.outputs.run_heavy || 'true' }}
          PLAN_RESULT: ${{ needs.plan.result }}
          REGRESSION_RESULT: ${{ needs.regression-tests.result }}
          CONTAINER_RESULT: ${{ needs.container-and-audit.result }}
          BROWSER_RESULT: ${{ needs.browser-csp.result }}
        run: >-
          python -B tools/ci_security_plan.py verify
          --run-heavy "$RUN_HEAVY"
          --plan-result "$PLAN_RESULT"
          --regression-result "$REGRESSION_RESULT"
          --container-result "$CONTAINER_RESULT"
          --browser-result "$BROWSER_RESULT"
