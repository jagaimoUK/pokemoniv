name: Reader handoff and floating navigation
on:
  push:
    branches: [feature/reader-quicknav-20261017, feature/raise-top-button-20261017, feature/web-thumb-direct-send-20261017]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 -m py_compile pvpoke_app_ui.py
      - run: node tests/test_app_ui_reader_bridge.js
      - run: node tests/test_app_android_direct_send.js
      - run: node tests/test_app_ui_queue.js
      - run: node tests/test_app_ui_share.js
      - run: node tests/test_app_ui_labels.js
