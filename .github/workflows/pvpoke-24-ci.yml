name: PvPoke 24-mode tests
on:
  push:
    branches:
      - 'feature/pvpoke-24-condition-batch-20261013'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q pvpoke_24_workflow.py pvpoke_web.py pvpoke_mcp_remote.py pvpoke_bridge_core.py pvpoke_iv_modes.py pvpoke_batch_v2.py pvpoke_archive.py
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run self-contained unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare 4 opponent modes from current PvPoke GameMaster
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {'candidate':{'species':'azumarill','fast':'BUBBLE','charged1':'ICE_BEAM','charged2':'PLAY_ROUGH'},'ivs':'0,15,15'}
          Path('/tmp/pvpoke24_smoke.json').write_text(json.dumps(payload))
          PY
          python pvpoke_24_workflow.py --prepare --batch-mode detailed --config /tmp/pvpoke24_smoke.json --output /tmp/pvpoke24_smoke
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/pvpoke24_smoke/manifest.json').read_text())
          assert all(result['mode_counts'].get(mode,0)>0 for mode in ('default','rank1','attack','defense')), result
          print('Real gamemaster preview passed:',result['mode_counts'],'excluded:',result['excluded'])
          PY
      - name: Prepare Default-only meta mode from current GameMaster
        run: |
          python pvpoke_24_workflow.py --prepare --config /tmp/pvpoke24_smoke.json --output /tmp/pvpoke6_smoke
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/pvpoke6_smoke/manifest.json').read_text())
          assert result['batch_mode'] == 'simple', result
          assert result['mode_counts']['default'] > 0, result
          assert list(result['mode_counts']) == ['default'], result
          assert result['opponent_iv_modes'] == ['default'], result
          print('Simple Default-only preview passed:', result['mode_counts'])
          PY
