name: Android overlay copy-queue demo build
on:
  push:
    branches: [feature/overlay-copy-queue-build-20261016]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: tar -xJf android-overlay-copy-demo.tar.xz
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p demo :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-copy-demo-debug-apk
          path: demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
