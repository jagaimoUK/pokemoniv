name: Reader minimal menu and cleanup routing

on:
  pull_request:
    paths:
      - 'android-integration/readerquickmenu/**'
      - 'pvpoke_app_ui.py'
      - 'tests/test_app_ui_low_score_visibility.js'
      - '.github/workflows/reader-minimal-menu.yml'
  workflow_dispatch:

jobs:
  web-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_app_ui_low_score_visibility.js
      - run: node tests/test_app_ui_low_score.js
      - run: node tests/test_app_ui_share.js

  android-quick-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy reader module into isolated Android test harness
        run: |
          cp android-integration/IvSelectionText.kt demo/app/src/main/java/com/example/pokemonivreader/
          mkdir -p demo/app/src/main/java/com/example/pokemonivreader/readerquickmenu
          mkdir -p demo/app/src/test/java/com/example/pokemonivreader/readerquickmenu
          cp android-integration/readerquickmenu/ReaderCleanupStore.kt android-integration/readerquickmenu/ReaderQuickMenu.kt demo/app/src/main/java/com/example/pokemonivreader/readerquickmenu/
          cp android-integration/readerquickmenu/ReaderQuickMenuTest.kt demo/app/src/test/java/com/example/pokemonivreader/readerquickmenu/
          cp android-integration/overlayqueue/OverlayCopyQueueImportActivity.kt demo/app/src/main/java/com/example/pokemonivreader/overlayqueue/
      - name: Compile and run JVM Android tests (not a production APK)
        run: gradle -p demo :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
