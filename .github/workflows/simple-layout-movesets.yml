name: Simple layout, handoff and exhaustive movesets
on:
  push:
    branches: [feature/thumb-layout-order-20261029]
  pull_request:
    paths: ['pvpoke_app_ui.py', 'pvpoke_app_selection.py', 'pvpoke_web.py', 'pvpoke_result_cache.py', 'tests/test_app_ui_*.js', 'tests/test_moveset_summary.py', '.github/workflows/simple-layout-movesets.yml']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: |
          for test in tests/test*.js; do node "$test" || exit 1; done
      - name: Check actual Chromium layout on mobile and desktop
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/layout-browser" playwright@1.62.1 --no-save
          NODE_PATH="$RUNNER_TEMP/layout-browser/node_modules" node tests/browser_layout_smoke.js
