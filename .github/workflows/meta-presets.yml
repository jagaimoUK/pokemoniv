name: Meta preset regression and image build
on:
  push:
    branches: ['feature/meta-presets-20261027', 'feature/meta-preset-export-20261027']
  pull_request:
    paths: ['pvpoke_meta_presets.py', 'pvpoke_meta_live.py', 'pvpoke_app_ui.py', 'pvpoke_web.py', 'pvpoke_iv_workflow.py', 'pvpoke_bridge_core.py', 'pvpoke_mcp_remote.py', 'data/pvpoke_meta_presets.json', 'Dockerfile', 'tools/check_meta_controls_layout.py', 'tests/**', '.github/workflows/meta-presets.yml']
permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: for file in tests/test_app_*.js; do node "$file"; done
      - run: python -m compileall -q .
      - run: docker build -t pokemoniv-meta-presets .
      - name: Check preset layout in Chromium
        run: >-
          docker run --rm --entrypoint sh -v "$PWD:/work" -e PYTHONPATH=/app
          pokemoniv-meta-presets -c
          'apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null && python /work/tools/check_meta_controls_layout.py --output-dir /work/meta-controls-qa'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: meta-controls-qa
          path: meta-controls-qa
          if-no-files-found: warn
