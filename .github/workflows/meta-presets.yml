name: Meta preset regression and image build
on:
  push:
    branches: ['feature/meta-presets-20261027', 'feature/meta-preset-export-20261027']
  pull_request:
    paths: ['pvpoke_meta_presets.py', 'pvpoke_app_ui.py', 'pvpoke_web.py', 'pvpoke_iv_workflow.py', 'pvpoke_bridge_core.py', 'pvpoke_mcp_remote.py', 'data/pvpoke_meta_presets.json', 'Dockerfile', 'tools/check_meta_controls_layout.py', 'tests/**', '.github/workflows/meta-presets.yml']
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: for file in tests/test_app_*.js; do node "$file"; done
      - run: python -m compileall -q .
      - run: docker build -t pokemoniv-meta-presets .
      - name: Check preset layout in Chromium
        run: >-
          docker run --rm --entrypoint sh -v "$PWD:/work" -e PYTHONPATH=/app
          pokemoniv-meta-presets -c
          'apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null && python /work/tools/check_meta_controls_layout.py --output-dir /work/meta-controls-qa'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-controls-qa
          path: meta-controls-qa
          if-no-files-found: warn
