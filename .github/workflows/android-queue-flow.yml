name: Android queue flow
on:
  push:
    branches: ['feature/overlay-queue-flow-*']
  pull_request:
    paths: ['android-integration/overlayqueue/**', 'android-integration/queue-flow/**', '.github/workflows/android-queue-flow.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Include the reader cleanup bridge imported by the queue activity
        run: |
          mkdir -p android-integration/queue-flow/verification/app/src/main/java/com/example/pokemonivreader/readerquickmenu
          cp android-integration/readerquickmenu/ReaderCleanupStore.kt android-integration/queue-flow/verification/app/src/main/java/com/example/pokemonivreader/readerquickmenu/
      - run: gradle -p android-integration/queue-flow/verification :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-flow-test-results
          path: android-integration/queue-flow/verification/app/build/reports/tests/

  windows-installer:
    runs-on: windows-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify installer using Windows PowerShell 5.1
        shell: powershell
        run: .\android-integration\queue-flow\verification\Test-Installer.ps1
