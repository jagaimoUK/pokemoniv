name: Android queue flow
on:
  push:
    branches: ['feature/overlay-queue-flow-*']
  pull_request:
    paths: ['android-integration/overlayqueue/**', 'android-integration/queue-flow/**', '.github/workflows/android-queue-flow.yml']
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: {gradle-version: '8.9'}
      - run: gradle -p android-integration/queue-flow/verification :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: queue-flow-test-results
          path: android-integration/queue-flow/verification/app/build/reports/tests/

  windows-installer:
    runs-on: windows-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify installer using Windows PowerShell 5.1
        shell: powershell
        run: .\android-integration\queue-flow\verification\Test-Installer.ps1
