name: Visual reference backup

on:
  push:
    branches: [main]
    paths:
      - visual_backup.py
      - pvpoke_mcp_remote.py
      - requirements.txt
      - tests/test_visual_backup.py
      - .github/workflows/visual-backup.yml
  pull_request:
    paths:
      - visual_backup.py
      - pvpoke_mcp_remote.py
      - requirements.txt
      - tests/test_visual_backup.py
      - .github/workflows/visual-backup.yml

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_visual_backup.py
