name: Visual reference backup

on:
  push:
    branches: [main]
    paths:
      - visual_backup.py
      - pvpoke_mcp_remote.py
      - requirements.txt
      - tests/test_visual_backup.py
      - .github/workflows/visual-backup.yml
  pull_request:
    paths:
      - visual_backup.py
      - pvpoke_mcp_remote.py
      - requirements.txt
      - tests/test_visual_backup.py
      - .github/workflows/visual-backup.yml

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_visual_backup.py
