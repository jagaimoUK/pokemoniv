name: Low-score Pokémon GO search
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'data/cp1500_role_scores_20261015.json'
      - 'data/pokemon_species_evolutions_20261019.json'
      - 'pvpoke_web.py'
      - 'pvpoke_score_search.py'
      - 'pvpoke_reader_cleanup.py'
      - 'pvpoke_mcp_remote.py'
      - 'pvpoke_app_ui.py'
      - 'android-integration/overlayqueue/**'
      - 'tests/test_low_score_search.py'
      - 'tests/test_reader_cleanup_contract.py'
      - 'tests/test_app_ui_low_score_visibility.js'
      - 'tests/test_app_ui_low_score.js'
      - 'demo/app/src/test/java/com/example/pokemonivreader/overlayqueue/LowScoreQueueTest.kt'
      - '.github/workflows/low-score-search.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pvpoke_score_search.py'
      - 'pvpoke_reader_cleanup.py'
      - 'pvpoke_mcp_remote.py'
      - 'pvpoke_app_ui.py'
      - 'android-integration/overlayqueue/OverlayCopyQueueImportActivity.kt'
      - 'tests/test_low_score_search.py'
      - 'tests/test_reader_cleanup_contract.py'
      - 'tests/test_app_ui_low_score_visibility.js'
      - 'tests/test_app_ui_low_score.js'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_low_score_search.py' -v
      - run: python -m unittest discover -s tests -p 'test_reader_cleanup_contract.py' -v
      - run: python -m py_compile pvpoke_mcp_remote.py pvpoke_app_ui.py pvpoke_score_search.py pvpoke_reader_cleanup.py
      - run: node tests/test_app_ui_low_score.js
      - run: node tests/test_app_ui_low_score_visibility.js
      - run: node tests/test_app_ui_share.js
      - run: node tests/test_app_ui_queue.js
      - run: node tests/test_app_ui_bulk_status.js
  android-integration-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Verify reader entry against demo compile (NOT a production reader APK)
        run: |
          cp android-integration/IvSelectionText.kt demo/app/src/main/java/com/example/pokemonivreader/
          cp android-integration/overlayqueue/OverlayPairParser.kt demo/app/src/main/java/com/example/pokemonivreader/overlayqueue/
          cp android-integration/overlayqueue/OverlayQueueStore.kt demo/app/src/main/java/com/example/pokemonivreader/overlayqueue/
          cp android-integration/overlayqueue/OverlayCopyQueueImportActivity.kt demo/app/src/main/java/com/example/pokemonivreader/overlayqueue/
          gradle -p demo :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
