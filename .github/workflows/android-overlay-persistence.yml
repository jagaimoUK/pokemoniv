name: Overlay UX build and regression
on:
  push:
    branches:
      - feature/overlay-no-outside-dismiss-scroll-20261017
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract baseline and apply collision fix
        run: |
          tar -xJf android-overlay-copy-demo.tar.xz
          python3 tests/patch_overlay_collision.py
      - name: Export isolated demo controller for review
        run: |
          mkdir -p android-overlay-snapshot
          cp demo/app/src/main/java/com/example/pokemonivreader/overlayqueue/OverlayCopyQueueController.kt android-overlay-snapshot/OverlayCopyQueueController.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-overlay-snapshot/OverlayCopyQueueController.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Add reproducible overlay controller snapshot for UX patch'
            git push origin HEAD:feature/overlay-no-outside-dismiss-scroll-20261017
          fi
      - name: Build debug APK
        run: gradle -p demo :app:assembleDebug --no-daemon --stacktrace
