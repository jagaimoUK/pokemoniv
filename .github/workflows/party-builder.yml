name: Party Builder checks
on:
  pull_request:
    paths:
      - "pvpoke_party_*.py"
      - "pvpoke_web.py"
      - "pvpoke_mcp_remote.py"
      - "pvpoke_app_ui.py"
      - "tests/test_party_builder.py"
      - ".github/workflows/party-builder.yml"
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax compile and unit tests
        run: |
          python -m compileall -q pvpoke_party_core.py pvpoke_party_backend.py pvpoke_party_ui.py pvpoke_web.py pvpoke_mcp_remote.py
          python -m unittest discover -s tests -p test_party_builder.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify embedded Party UI JavaScript syntax
        run: |
          python -c 'import pvpoke_party_ui as p; from pathlib import Path; Path("/tmp/party-ui.js").write_text(p.HTML.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/party-ui.js
