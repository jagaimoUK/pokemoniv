name: Party Builder checks
on:
  pull_request:
    paths:
      - "pvpoke_party_*.py"
      - "pvpoke_web.py"
      - "pvpoke_mcp_remote.py"
      - "pvpoke_app_ui.py"
      - "tests/test_party_builder.py"
      - ".github/workflows/party-builder.yml"
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax compile and unit tests
        run: |
          python -m compileall -q pvpoke_party_core.py pvpoke_party_backend.py pvpoke_party_ui.py pvpoke_web.py pvpoke_mcp_remote.py
          python -m unittest discover -s tests -p test_party_builder.py -v
