name: Android Web Share contract
on:
  push:
    paths:
      - 'pvpoke_app_ui.py'
      - 'tests/test_app_ui_share.js'
      - '.github/workflows/android-web-share.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          node tests/test_app_ui_share.js
          node tests/test_app_ui_queue.js
          node tests/test_app_ui_labels.js
          node tests/test_app_meta_ui.js
