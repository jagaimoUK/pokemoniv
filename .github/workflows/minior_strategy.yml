name: Minior Strategy Verification
on:
  push:
    branches:
      - feature/minior-energy-hold-20261020
  pull_request:
    paths:
      - 'pvpoke_minior_strategy.js'
      - 'pvpoke_node_matrix.js'
      - 'pvpoke_direct_backend.py'
      - 'pvpoke_batch_v2.py'
      - 'pvpoke_24_workflow.py'
      - 'tests/test_minior_strategy.cjs'
      - 'tests/test_minior_evidence.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and policy unit tests
        run: |
          node --check pvpoke_node_matrix.js
          node --check pvpoke_minior_strategy.js
          node tests/test_minior_strategy.cjs
          python -m py_compile pvpoke_direct_backend.py pvpoke_batch_v2.py pvpoke_24_workflow.py pvpoke_app_selection.py pvpoke_app_ui.py
          python -m unittest discover -s tests -p 'test_minior_evidence.py' -v
      - name: Inspect current PvPoke Minior form data (diagnostic only)
        run: |
          python - <<'PY'
          import json, urllib.request
          from pvpoke_batch_v2 import RAW
          try:
              with urllib.request.urlopen(RAW+'data/gamemaster.json',timeout=30) as response:
                  gm=json.load(response)
              rows=[p for p in gm['pokemon'] if str(p.get('speciesId','')).startswith('minior')]
              for p in rows:
                  print(json.dumps({'id':p.get('speciesId'), 'name':p.get('speciesName'),
                      'dex':p.get('dex'),'baseStats':p.get('baseStats'),
                      'formChange':p.get('formChange'),
                      'originalFormId':p.get('originalFormId')},ensure_ascii=False))
              if not rows: print('NO MINIOR IN REMOTE GAMEMASTER')
          except Exception as exc:
              print('Diagnostic download unavailable:',type(exc).__name__,str(exc)[:160])
          PY
      - name: Real pinned PvPoke Minior integration smoke
        run: |
          PYTHONPATH=. python tests/smoke_minior_direct.py
