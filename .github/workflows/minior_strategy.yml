name: Minior Strategy Verification
on:
  push:
    branches:
      - feature/minior-energy-hold-20261020
  pull_request:
    paths:
      - 'pvpoke_minior_strategy.js'
      - 'pvpoke_node_matrix.js'
      - 'pvpoke_direct_backend.py'
      - 'pvpoke_batch_v2.py'
      - 'pvpoke_24_workflow.py'
      - 'tests/test_minior_strategy.cjs'
      - 'tests/test_minior_evidence.py'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and policy unit tests
        run: |
          node --check pvpoke_node_matrix.js
          node --check pvpoke_minior_strategy.js
          node tests/test_minior_strategy.cjs
          python -m py_compile pvpoke_direct_backend.py pvpoke_batch_v2.py pvpoke_24_workflow.py
          python -m unittest discover -s tests -p 'test_minior_evidence.py' -v
