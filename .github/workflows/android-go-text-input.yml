name: Android GO text input verification
on:
  push:
    branches: ['feature/go-text-input-*']
  pull_request:
    paths:
      - 'android-integration/overlayqueue/**'
      - 'android-integration/go-text-input/**'
      - '.github/workflows/android-go-text-input.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android-integration/queue-flow/verification :app:testDebugUnitTest :app:assembleDebug --stacktrace
  windows-installer:
    runs-on: windows-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify PowerShell installer against baseline and rollback
        shell: powershell
        run: .\android-integration\go-text-input\Test-GoTextInputInstaller.ps1
